# The machine contract for the brief template: the geometry engine/check.py
# enforces. The `brief` template is enforced structure
# (4-6 tagged items, every item cited). The series mode controls scheduling,
# while this package only supplies the item geometry. Bands are defaults a
# series may replace. A press adds or redefines templates as folder packages
# under press/templates/<id>/.
about: "A batch of current developments: an itemized roundup in which every item explains why it matters."
class: shortread
bands:
  items: [4, 6]
sections: [items, sources]
cite_rule: per-item
chrome:
  - '<body class="nb-article">'
  - "<h2>Sources</h2>"
