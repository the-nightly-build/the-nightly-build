# A sequence: an ordered course. The orchestrator reads the published lessons
# before writing the next, and recaps reference them concretely. A sequence
# grows by appending items. Published lessons never reorder.
name: Kernels
mode: sequence
section: "Foundations"
template: article
prompt: prompt.md
# A pinned voice guide: a course should sound the same lesson to lesson, so the
# voice is settled once here instead of rediscovered nightly. The
# writing coach does not run for a series that pins one.
voice_guide: voice-guide.md
strict: false
bands:
  words: [1800, 4500] # a lesson needs room to build an idea, show code, and check it
min_sources: 8
cadence: [sun] # a weekly deep lesson
tags: # shared angle fragments, pulled in when a lesson carries the tag
  hardware: ../_tags/hardware.md
  benchmarks: ../_tags/benchmarks.md
