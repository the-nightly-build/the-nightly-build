# Engine code CI. Lints, type-checks, formats, and tests the engine on main.
# Scoped to main ONLY: this is walled off from the content pipeline (check.yml
# on library) and the user fork flow. It is never seeded onto library.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: shfmt@3.11.0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - run: uvx prek@0.5.11 run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked --group figure-capture --group charts pytest

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
